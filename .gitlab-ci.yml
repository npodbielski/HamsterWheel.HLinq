include:
  # Shared buildah image build+push job (hidden .buildah-image).
  - project: "ci/templates"
    ref: "main"
    file: "/buildah-image.yml"
  # Shared NuGet pack + publish job (hidden .nuget-publish): project registry
  # first, then nuget.org with --skip-duplicate and a fail-loud nuget_key.
  - project: "ci/templates"
    ref: "main"
    file: "/nuget-publish.yml"
  # Feed policy and release gate for projects publishing public packages
  # (hidden .nuget-restore, .release-policy).
  - project: "ci/templates"
    ref: "main"
    file: "/nuget-project.yml"
  # Shared test + coverage-gate job (hidden .dotnet-test), one instance per
  # test project below.
  - project: "ci/templates"
    ref: "main"
    file: "/dotnet-test-coverage.yml"
  # Shared style and inspection gates (hidden .dotnet-format, .code-inspection).
  - project: "ci/templates"
    ref: "main"
    file: "/dotnet-format.yml"
  - project: "ci/templates"
    ref: "main"
    file: "/dotnet-inspection.yml"
  # Release jobs (hidden .badges, .release): badge SVGs on the badge host, the
  # git tag, the GitLab release and the public GitHub mirror.
  - project: "ci/templates"
    ref: "main"
    file: "/release.yml"
  # README gate (hidden .readme-check): badges referenced, versions in sync.
  - project: "ci/templates"
    ref: "main"
    file: "/readme-check.yml"

stages:
  - build
  - test
  - release
  - publish
  - deploy

image: mcr.microsoft.com/dotnet/sdk:10.0

variables:
  OBJECTS_DIRECTORY: 'obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  NUGET_RESTORE_TARGET: 'HLinq.slnx'
  NUGET_FAMILY_FEED_URL: "${CI_API_V4_URL}/groups/69/-/packages/nuget/index.json"
  SOURCE_CODE_PATH: ''
  FF_NETWORK_PER_BUILD: "true"

cache:
  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/project.assets.json'
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/*.csproj.nuget.*'
    - '$NUGET_PACKAGES_DIRECTORY'
  policy: pull-push

.dotnet:
  before_script:
    - !reference [.nuget-restore, script]

build:
  stage: build
  extends: .dotnet
  script:
    - 'dotnet build --no-restore'

# One shared-gate instance per test project (.dotnet-test from ci/templates);
# .dotnet keeps the feed policy + restore the suites need. The template
# must sit directly in extends: hidden jobs from includes are not extendable
# through intermediate local jobs.

# 91.6% line as of migration, default gate 0.80
tests-unit:
  extends:
    - .dotnet
    - .dotnet-test
  variables:
    # measure this repo's libraries only: third-party and group-feed packages
    # (Humanizer, AspNet/PgSql/Client) sit in the test output and drag the
    # gate to ~0.25; Demo is the demo app, not a shipped library
    COVERAGE_EXCLUDE_FILTER: "[*]*.Program [HamsterWheel.HLinq.Demo*]* [Humanizer]* [HamsterWheel.HLinq.AspNet]* [HamsterWheel.HLinq.PgSql]* [HamsterWheel.HLinq.Client]* [MySqlConnector]* [Testcontainers*]* [Docker.DotNet*]* [Microsoft.Net.Http.Client]*"
    DOTNET_TEST_TARGET: test/HamsterWheel.HLinq.UnitTests
    TEST_RESULTS_DIR: ./test-results/unit

# 86.4% line as of migration, default gate 0.80
tests-netstandard:
  extends:
    - .dotnet
    - .dotnet-test
  variables:
    COVERAGE_EXCLUDE_FILTER: "[*]*.Program [HamsterWheel.HLinq.Demo*]* [Humanizer]* [HamsterWheel.HLinq.AspNet]* [HamsterWheel.HLinq.PgSql]* [HamsterWheel.HLinq.Client]* [MySqlConnector]* [Testcontainers*]* [Docker.DotNet*]* [Microsoft.Net.Http.Client]*"
    DOTNET_TEST_TARGET: test/HamsterWheel.HLinq.UnitTests.NetStandard
    TEST_RESULTS_DIR: ./test-results/netstandard

tests-integration:
  extends:
    - .dotnet
    - .dotnet-test
  services:
    - name: postgres
  variables:
    FF_NETWORK_PER_BUILD: 1
    POSTGRES_PASSWORD: outflank-outage-undoing
    POSTGRES_DB: Demo
    POSTGRES_HOST: postgres
    COVERAGE_EXCLUDE_FILTER: "[*]*.Program [HamsterWheel.HLinq.Demo*]* [Humanizer]* [HamsterWheel.HLinq.AspNet]* [HamsterWheel.HLinq.PgSql]* [HamsterWheel.HLinq.Client]* [MySqlConnector]* [Testcontainers*]* [Docker.DotNet*]* [Microsoft.Net.Http.Client]*"
    DOTNET_TEST_TARGET: test/HamsterWheel.HLinq.IntegrationTests
    TEST_RESULTS_DIR: ./test-results/integration

badges:
  extends: .badges
  allow_failure: true
  variables:
    BADGE_SLUG: hlinq
    BADGES_SUITES: "unit=test-results/unit netstandard=test-results/netstandard integration=test-results/integration"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
      variables:
        BADGES_PIPELINE_STATE: passed

badges-failed:
  extends: .badges
  allow_failure: true
  variables:
    BADGE_SLUG: hlinq
    BADGES_SUITES: "unit=test-results/unit netstandard=test-results/netstandard integration=test-results/integration"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_failure
      variables:
        BADGES_PIPELINE_STATE: failed

release:
  extends: .release
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  variables:
    GIT_DEPTH: "0"
    BADGE_SLUG: hlinq
    GITHUB_MIRROR_URL: "git@github.com:npodbielski/HamsterWheel.HLinq.git"

release-policy:
  extends: .release-policy
  stage: test

readme-check:
  extends: .readme-check
  stage: test
  variables:
    BADGE_SLUG: hlinq
    README_BADGES: "release,pipeline,tests,coverage-unit,coverage-netstandard,coverage-integration"
    README_PACKAGE_PREFIXES: HamsterWheel.HLinq

format-hlinq:
  # .dotnet: shared restore, feeds per branch policy - without it `dotnet format`
  # resolved from whatever the shared cache happened to hold and died silently
  extends:
    - .dotnet
    - .dotnet-format
  variables:
    DOTNET_SOLUTION: HLinq.slnx

inspect-hlinq:
  # baseline probe: 0 errors (140 warnings, 350 notes in the SARIF),
  # so the fleet-standard hard gate at error level is green from day one
  extends:
    - .dotnet
    - .code-inspection
  variables:
    DOTNET_SOLUTION: HLinq.slnx

package-alpha:
  stage: deploy
  extends: .dotnet
  rules:
    - if: $CI_COMMIT_BRANCH == "alpha"
  script:
    - dotnet pack -c Release --version-suffix $CI_COMMIT_BRANCH-$CI_JOB_ID
    # Configure GitLab package registry as a NuGet source
    - dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" --name gitlab --username gitlab-ci-token --password $CI_JOB_TOKEN --store-password-in-clear-text
    # Push the package to the project's package registry
    - dotnet nuget push "src/**/bin/Release/*.nupkg" --source gitlab
  environment: staging

publish-api:
  stage: publish
  extends: .dotnet
  script:
    - 'BUILD_CONFIGURATION=Release'
    - 'cd demo/HamsterWheel.HLinq.Demo'
    - 'dotnet publish "./HamsterWheel.HLinq.Demo.csproj" --no-restore -c $BUILD_CONFIGURATION /p:UseAppHost=false'
  artifacts: 
    paths:
      - /builds/hamster-wheel/hlinq/demo/HamsterWheel.HLinq.Demo/bin/Release/net10.0/publish

# Demo app image, built by the shared buildah template (ci/templates) instead
# of kaniko. The Dockerfile COPYs the publish-api output, hence needs: it.
build-docker-image:
  extends: .buildah-image
  stage: publish
  needs:
    - publish-api
  variables:
    BUILDAH_CONTEXT: demo/HamsterWheel.HLinq.Demo
    BUILDAH_DOCKERFILE: demo/HamsterWheel.HLinq.Demo/Dockerfile
    IMAGE_REFS: "$CI_REGISTRY_IMAGE/hlinq-demo:$CI_JOB_ID $CI_REGISTRY_IMAGE/hlinq-demo:latest"

package:
  stage: deploy
  # .dotnet keeps the group feed source + restore (CodeShare packages come
  # from there); .nuget-publish owns pack and both pushes.
  extends:
    - .dotnet
    - .nuget-publish
  needs:
    - release
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        # src change OR a version bump: a bump-only merge must publish too,
        # otherwise a patch bump after a failed 409 publish never ships
        - src/**/*
        - Nuget.props
  variables:
    NUGET_PACK_TARGET: HLinq.slnx
  environment: production