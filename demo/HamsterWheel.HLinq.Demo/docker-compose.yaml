services:
  demo:
    hostname: api
    image: hlinq-demo
    ports:
      - "5087:8080"

  postgres:
    hostname: postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: outflank-outage-undoing
      POSTGRES_USER: postgres
      POSTGRES_DB: Demo


networks:
  default:
    name: demo